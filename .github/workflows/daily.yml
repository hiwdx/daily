name: Daily AI Briefing

on:
  schedule:
    # Beijing 04:30, 05:30, 06:00, 10:30 and 11:30; scheduling may be delayed.
    - cron: '30 20 * * *'
    - cron: '30 21 * * *'
    - cron: '0 22 * * *'
    - cron: '30 2 * * *'
    - cron: '30 3 * * *'
    # Recover missing/provisional issues at 12:17–22:17 Beijing.
    - cron: '17 4-14/2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'true forces regeneration, including a complete issue'
        required: false
        default: 'false'

concurrency:
  group: daily-briefing-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pages: write
      issues: write
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check complete issue and provisional status
        id: check
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          NEEDED=$(python3 scripts/briefing_health.py needed)
          if [ "${FORCE:-false}" = 'true' ]; then NEEDED=true; fi
          echo "needed=$NEEDED" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.check.outputs.needed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        if: steps.check.outputs.needed == 'true'
        run: pip install --retries 3 --timeout 30 -r requirements.txt

      - name: Run reliability and editorial tests
        if: steps.check.outputs.needed == 'true'
        run: python -m unittest discover -s tests -v

      - name: Generate and validate daily briefing
        if: steps.check.outputs.needed == 'true'
        timeout-minutes: 12
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          python generate.py
          python scripts/briefing_health.py local

      - name: Commit and push with bounded retries
        if: steps.check.outputs.needed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'AI Briefing Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "📰 AI 简报 $(TZ=Asia/Shanghai date +'%Y-%m-%d')"
          for attempt in 1 2 3; do
            git fetch origin main
            # Never overwrite conflicting human edits automatically.
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          echo '::error::Failed to publish the generated commit'
          exit 1

      - name: Explicitly request Pages publication
        # GITHUB_TOKEN pushes do not trigger Pages builds automatically.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/briefing_health.py local
          gh api --method POST "repos/${{ github.repository }}/pages/builds"

      - name: Verify actual website publication
        id: online
        run: python3 scripts/briefing_health.py online

      - name: Report failure or degraded publication
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          ONLINE_STATUS: ${{ steps.online.outcome }}
        run: |
          set -euo pipefail
          TODAY=$(TZ=Asia/Shanghai date +'%Y-%m-%d')
          MODE=$(python3 -c "import json; print(json.load(open('docs/status.json')).get('mode','unknown'))" 2>/dev/null || echo unknown)
          if [ "$JOB_STATUS" = success ] && [ "$ONLINE_STATUS" = success ] && [ "$MODE" = editorial ]; then
            echo 'Full editorial issue verified online.'
            exit 0
          fi
          echo "::warning::Briefing requires attention: job=$JOB_STATUS online=$ONLINE_STATUS mode=$MODE"
          gh label create briefing-missing --color D73A4A --description 'Briefing missing, degraded or not published' --force
          EXISTING=$(gh issue list --label briefing-missing --state open --search "$TODAY in:title" --json number --jq '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh issue create --label briefing-missing --title "⚠️ 每日简报异常：${TODAY}" \
              --body "生成或上线异常，或目前仅发布原文速览（mode=$MODE）。后续定时任务将自动重试。[查看日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})。"
          fi
          if [ "$JOB_STATUS" != success ] || [ "$ONLINE_STATUS" != success ]; then exit 1; fi
